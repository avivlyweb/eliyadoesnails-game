    :root {

    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 40%, #9cd3f7 0%, #76aed4 100%);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    header {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .badge {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }
    .badge-sub {
      font-size: 11px;
      color: #78625b;
      font-family: ui-monospace, monospace;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
      outline: none;
    }
    .controls-panel {
      position: absolute;
      bottom: 28px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 10px 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
      z-index: 10;
    }
    .btn {
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: #fff0ee;
      color: var(--accent);
      border-color: var(--accent);
    }
    .hint {
      font-size: 11.5px;
      color: #78625b;
      font-weight: 500;
    }
  </style>

    const viewer = document.getElementById('viewer');
    const btnRotate = document.getElementById('btn-toggle-rotate');
    const btnReset = document.getElementById('btn-reset-view');

    btnRotate.addEventListener('click', () => {

      viewer.cameraTarget = 'auto auto auto';

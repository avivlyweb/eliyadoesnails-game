<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Character Preview · Korean Peach Mochi Bunny with Morph Targets</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #7cb3d9;
      --panel: rgba(255, 255, 255, 0.94);
      --accent: #f87a6c;
      --text: #24130e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 40%, #9cd3f7 0%, #76aed4 100%);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    header {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .badge {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }
    .badge-sub {
      font-size: 11px;
      color: #78625b;
      font-family: ui-monospace, monospace;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
      outline: none;
    }
    .controls-panel {
      position: absolute;
      bottom: 28px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 10px 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn:hover {
      background: #fff0ee;
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span style="font-size: 22px;">🐰</span>
      <div>
        <div class="badge-title">Peach Mochi Bunny · Korean Nail Studio Creature</div>
        <div class="badge-sub">Blender 5.2.2 LTS · Morph Targets: Wink, Blink & Smile · BSDF v2 SSS Velvet</div>
      </div>
    </div>
    <div class="badge">
      <span style="color: #10b981; font-weight: 700;">● BLENDER 5.2 EXTENSIONS & MORPH ACTIVE</span>
    </div>
  </header>

  <model-viewer
    id="viewer"
    src="data:model/gltf-binary;base64,${glbBase64}"
    alt="3D Peach Mochi Bunny"
    camera-controls
    auto-rotate
    rotation-per-second="26deg"
    shadow-intensity="1.6"
    shadow-softness="0.7"
    exposure="1.0"
    camera-orbit="0deg 85deg 2.4m"
    min-camera-orbit="auto auto 1.0m"
    max-camera-orbit="auto auto 4.0m">
  </model-viewer>

  <div class="controls-panel">
    <button class="btn" id="btn-spin">⏸ Pause Spin</button>
    <button class="btn" id="btn-front">⌖ Front View</button>
    <button class="btn" id="btn-perspective">📸 3/4 Angle</button>
    <span style="width: 1px; height: 16px; background: rgba(0,0,0,0.1); margin: 0 4px;"></span>
    <span style="font-size: 11px; font-weight: 600; color: #78625b;">Expressions:</span>
    <button class="btn" id="btn-wink-r">😉 Wink Right</button>
    <button class="btn" id="btn-wink-l">😉 Wink Left</button>
    <button class="btn" id="btn-smile">◡̈ Smile</button>
    <button class="btn" id="btn-reset">✨ Reset Face</button>
  </div>

  <script>
    const viewer = document.getElementById("viewer");
    const btnSpin = document.getElementById("btn-spin");
    const btnFront = document.getElementById("btn-front");
    const btn34 = document.getElementById("btn-perspective");

    let isSpinning = true;
    btnSpin.addEventListener("click", () => {
      isSpinning = !isSpinning;
      viewer.autoRotate = isSpinning;
      btnSpin.textContent = isSpinning ? "⏸ Pause Spin" : "▶ Resume Spin";
    });

    btnFront.addEventListener("click", () => {
      viewer.cameraOrbit = "0deg 88deg 2.3m";
    });

    btn34.addEventListener("click", () => {
      viewer.cameraOrbit = "35deg 78deg 2.5m";
    });

    // Morph target controls via model-viewer scene
    function setMorph(name, val) {
      if (!viewer.model) return;
      // Traverse scene graph if available
      viewer.model.traverse && viewer.model.traverse(node => {
        if (node.morphTargetDictionary && node.morphTargetInfluences) {
          if (name in node.morphTargetDictionary) {
            const idx = node.morphTargetDictionary[name];
            node.morphTargetInfluences[idx] = val;
          }
        }
      });
    }

    document.getElementById("btn-wink-r").addEventListener("click", () => {
      setMorph("wink", 1.0);
    });

    document.getElementById("btn-wink-l").addEventListener("click", () => {
      setMorph("wink", 1.0);
    });

    document.getElementById("btn-smile").addEventListener("click", () => {
      setMorph("smile", 1.0);
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      setMorph("wink", 0.0);
      setMorph("smile", 0.0);
    });
  </script>
</body>
</html>
